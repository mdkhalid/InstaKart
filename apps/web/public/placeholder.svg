<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="No image available">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Frame -->
  <g transform="translate(200 150)">
    <rect x="-90" y="-60" width="180" height="120" rx="12" fill="none" stroke="#86efac" stroke-width="3"/>

    <!-- Mountain -->
    <path d="M -78 48 L -34 -8 L -8 18 L 22 -22 L 56 16 L 78 48 Z"
          fill="#bbf7d0" stroke="#86efac" stroke-width="2" stroke-linejoin="round"/>

    <!-- Sun -->
    <circle cx="40" cy="-32" r="12" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Label -->
  <text x="200" y="250" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="500" fill="#16a34a" opacity="0.8">
    No image
  </text>
</svg>
